<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หน้าแรกมือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>body{margin:0}a{color:#004AAD}a:hover{color:#003A8A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F9FC; color: #0A2540; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 18px; line-height: 28px; display: flex; flex-direction: column;">
  <div style="flex-grow: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <div>
        <div style="font-size: 22px; line-height: 30px; font-weight: 600;">สวัสดี คุณตัวอย่าง</div>
        <div style="font-size: 16px; line-height: 24px; color: #425466;">ศุกร์ 06/11/2026</div>
      </div>
      <button onClick="{{toggle}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E8EE; background: #FFFFFF; color: #0A2540; font: inherit; font-size: 16px; cursor: pointer;">{{roleLabel}}</button>
    </div>
    <a href="Clock.dc.html" style="min-height: 60px; box-sizing: border-box; border-radius: 12px; background: #0E7A56; color: #FFFFFF; font-size: 20px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">ลงเวลาเข้างาน</a>
    <sc-if value="{{isMgmt}}" hint-placeholder-val="{{true}}">
      <a href="https://os.sricorporation.com" style="box-sizing: border-box; min-height: 104px; padding: 14px 16px; border-radius: 12px; background: #004AAD; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="display: flex; flex-direction: column;">
          <span style="font-size: 22px; line-height: 30px; font-weight: 600;">SRI OS</span>
          <span style="font-size: 16px; line-height: 24px;">บัญชี การเงิน ทรัพย์สิน</span>
        </span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M9 7h8v8"></path></svg>
      </a>
    </sc-if>
    <a href="Request.dc.html" style="box-sizing: border-box; min-height: 84px; padding: 12px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E8EE; color: #0A2540; text-decoration: none; display: flex; flex-direction: column; justify-content: center;">
      <span style="font-weight: 600;">ขอลา / OT</span>
      <span style="font-size: 16px; line-height: 24px; color: #425466;">ลาพักร้อนเหลือ 6 วัน</span>
    </a>
    <a href="Expense.dc.html" style="box-sizing: border-box; min-height: 84px; padding: 12px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E8EE; color: #0A2540; text-decoration: none; display: flex; flex-direction: column; justify-content: center;">
      <span style="font-weight: 600;">สำรองจ่าย</span>
      <span style="font-size: 16px; line-height: 24px; color: #425466;">รอโอนคืน ฿ 1,250</span>
    </a>
    <sc-if value="{{isMgmt}}" hint-placeholder-val="{{true}}">
      <a href="Approve.dc.html" style="box-sizing: border-box; min-height: 84px; padding: 12px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E8EE; color: #0A2540; text-decoration: none; display: flex; flex-direction: column; justify-content: center;">
        <span style="font-weight: 600;">อนุมัติ</span>
        <span style="font-size: 16px; line-height: 24px; color: #425466;">รออนุมัติ 3 รายการ</span>
      </a>
    </sc-if>
    <div aria-disabled="true" style="box-sizing: border-box; min-height: 84px; padding: 12px 16px; border-radius: 12px; background: #E9ECF0; border: 1px dashed #AEB7C2; color: #5B6673; display: flex; flex-direction: column; justify-content: center;">
      <span style="font-weight: 600;">Real Estate Op</span>
      <span style="font-size: 16px; line-height: 24px;">Coming soon</span>
    </div>
  </div>
  <nav aria-label="เมนูหลัก" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E3E8EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 16px;">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; color: #004AAD; font-weight: 600; text-decoration: none;">หน้าแรก</a>
    <a href="Clock.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">ลงเวลา</a>
    <a href="Request.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">คำขอ</a>
    <a href="Expense.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">เบิกเงิน</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { mgmt: true };
  renderVals() {
    const m = this.state.mgmt;
    return {
      isMgmt: m,
      roleLabel: m ? 'ดู: ผู้บริหาร' : 'ดู: พนักงาน',
      toggle: () => this.setState({ mgmt: !m })
    };
  }
}
</script>
</body>
</html>
