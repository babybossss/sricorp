<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>อนุมัติ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>body{margin:0}a{color:#004AAD}a:hover{color:#003A8A}</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F6F9FC; color: #0A2540; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 18px; line-height: 28px; display: flex; flex-direction: column;">
  <div style="flex-grow: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
    <div>
      <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600;">อนุมัติ</h1>
      <div style="color: #425466; font-size: 16px; line-height: 24px;">รออนุมัติ {{left}} รายการ</div>
    </div>
    <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 16px; line-height: 24px; color: #425466;"><span>{{item.type}}</span><span>{{item.who}}</span></div>
        <div style="font-weight: 600;">{{item.title}}</div>
        <div style="font-size: 16px; line-height: 24px; color: #425466;">{{item.detail}}</div>
        <sc-if value="{{item.isOpen}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <button onClick="{{item.reject}}" style="min-height: 52px; border: 1px solid #B3123A; border-radius: 10px; background: #FFFFFF; color: #B3123A; font: inherit; font-weight: 600; cursor: pointer;">ไม่อนุมัติ</button>
            <button onClick="{{item.approve}}" style="min-height: 52px; border: 0; border-radius: 10px; background: #004AAD; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer;">อนุมัติ</button>
          </div>
        </sc-if>
        <sc-if value="{{item.isConfirm}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="background: #EEF4FC; border-radius: 10px; padding: 10px 12px; font-size: 16px; line-height: 24px;">{{item.confirmText}}</div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
              <button onClick="{{item.cancel}}" style="min-height: 52px; border: 1px solid #C9D2DC; border-radius: 10px; background: #FFFFFF; color: #0A2540; font: inherit; font-weight: 600; cursor: pointer;">ยกเลิก</button>
              <button onClick="{{item.confirm}}" style="min-height: 52px; border: 0; border-radius: 10px; background: #004AAD; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer;">ยืนยันอนุมัติ</button>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{item.isDone}}" hint-placeholder-val="{{false}}">
          <div role="status" style="font-weight: 600; color: {{item.doneColor}};">{{item.doneText}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <nav aria-label="เมนูหลัก" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E3E8EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 16px;">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">หน้าแรก</a>
    <a href="Clock.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">ลงเวลา</a>
    <a href="Request.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">คำขอ</a>
    <a href="Expense.dc.html" style="display: flex; align-items: center; justify-content: center; color: #425466; text-decoration: none;">เบิกเงิน</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  state = { st: {} };
  set(id, v) { this.setState({ st: { ...this.state.st, [id]: v } }); }
  renderVals() {
    const base = [
      { id: 'ot', type: 'OT', who: 'พนักงาน ก', title: '06/11/2026 · 18:00–20:00', detail: 'รวม 2 ชั่วโมง · งานส่งเอกสาร' },
      { id: 'leave', type: 'ลาพักร้อน', who: 'พนักงาน ข', title: '10–11/11/2026 · 2 วัน', detail: 'วันลาคงเหลือ 6 วัน' },
      { id: 'exp', type: 'สำรองจ่าย', who: 'พนักงาน ค', title: '฿ 1,250 · ค่าน้ำมัน', detail: 'เติมน้ำมันรถบริษัท · บิลออกชื่อบริษัท · ค่าใช้จ่ายบริษัท SRI', money: true }
    ];
    const items = base.map((b) => {
      const s = this.state.st[b.id] || 'open';
      return {
        ...b,
        isOpen: s === 'open', isConfirm: s === 'confirm', isDone: s === 'yes' || s === 'no',
        doneText: s === 'yes' ? 'อนุมัติแล้ว' : 'ไม่อนุมัติ ส่งกลับให้ผู้ขอ',
        doneColor: s === 'yes' ? '#0B5F43' : '#B3123A',
        confirmText: 'ยืนยันอนุมัติเบิกเงิน ฿ 1,250 ให้พนักงาน ค ใช่หรือไม่',
        approve: () => this.set(b.id, b.money ? 'confirm' : 'yes'),
        reject: () => this.set(b.id, 'no'),
        cancel: () => this.set(b.id, 'open'),
        confirm: () => this.set(b.id, 'yes')
      };
    });
    return { items, left: items.filter((i) => i.isOpen || i.isConfirm).length };
  }
}
</script>
</body>
</html>
